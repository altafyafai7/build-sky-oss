name: Build GKI

on:
  workflow_call:
    inputs:
      TODO:
        type: string
      KSU:
        type: string
      KSU_SUSFS:
        type: string
      KSU_MANUAL_HOOK:
        type: string
      LAST_BUILD:
        type: string
      KERNEL_VERSION:
        type: string
      LTO:
        type: string

  workflow_dispatch:
    inputs:
      TODO:
        description: |
          What to build:
            kernel    → Full kernel + AnyKernel3 zip (default)
            defconfig → Only dump .config and upload (for debug/review)
        default: "kernel"
        type: choice
        options:
          - "kernel"
          - "defconfig"

      KSU:
        description: |
          Root type:
            no        → Vanilla kernel, no root (VNL)
            kernelsu  → Official KernelSU (tiann) — latest main, kprobes, no SuSFS
            next      → KernelSU-Next — kprobes + manual hooks, SuSFS v2.1.0 ✅
        default: "next"
        type: choice
        options:
          - "no"
          - "kernelsu"
          - "next"

      KSU_SUSFS:
        description: |
          Include SuSFS (kernel-side root hiding)?
            true  → simonpunk/susfs4ksu v2.1.0 — only works with KSU=next ✅
            false → No SuSFS
          Note: Ignored when KSU=no or KSU=kernelsu
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      KSU_MANUAL_HOOK:
        description: |
          Use Manual Hooks instead of kprobes? (KSU=next only)
            true  → Manual hooks (better detach/hide)
            false → kprobes (default)
          Note: Ignored for KSU=kernelsu (kprobes-only)
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      KERNEL_VERSION:
        description: |
          Target kernel version to build:
            5.10 → Xiaomi Redmi 12 5G (sky) — LineageOS 23.1 kernel
            6.1  → GKI Android 14 common kernel
            6.6  → GKI Android 15 common kernel
        default: "5.10"
        type: choice
        options:
          - "5.10"
          - "6.1"
          - "6.6"

      LTO:
        description: |
          Link-Time Optimisation mode:

            thin → Thin LTO  [RECOMMENDED for CI/testing]
                   • Parallel link — uses all CPU cores
                   • RAM: ~3–4 GB  |  Link time: ~2–5 min
                   • 95% of Full LTO quality in 10% of the time
                   • Used by Google in official GKI builds
                   • CFI fully supported ✅

            full → Full LTO  [For final/release builds only]
                   • Serial whole-program link — single-threaded
                   • RAM: ~14–18 GB  |  Link time: ~15–30 min
                   • Slightly better dead-code elimination (~2–4%)
                   • Marginally smaller binary, negligible real-world perf delta
                   • Requires 14 GB swap — runner may be slower ⚠️
        default: "thin"
        type: choice
        options:
          - "thin"
          - "full"

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest
    # thin LTO builds finish in ~45–60 min; full LTO needs up to ~90 min for the link step
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine Build Status
        run: |
          if [ "${{ toJson(github.event.inputs) }}" == "null" ]; then
            echo "STATUS=RELEASE" >> $GITHUB_ENV
            echo "TRIGGER=workflow_call" >> $GITHUB_ENV
          else
            echo "STATUS=BETA" >> $GITHUB_ENV
            echo "TRIGGER=workflow_dispatch" >> $GITHUB_ENV
          fi

      - name: Validate Inputs and Secrets
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }} # telegram chat id
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }} # telegram bot token
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # github token
          KSU: ${{ inputs.KSU }}
          KSU_SUSFS: ${{ inputs.KSU_SUSFS }}
          KSU_MANUAL_HOOK: ${{ inputs.KSU_MANUAL_HOOK }}
          LTO: ${{ inputs.LTO }}
        run: |
          _error() {
              echo "❌ ERROR: $*"
              let ret++
          }

          ret=0
          # Check Secrets
          if [[ -z "$TG_CHAT_ID" ]]; then
            _error "Missing TG_CHAT_ID secret (Telegram Chat ID)"
          fi
          if [[ -z "$TG_BOT_TOKEN" ]]; then
            _error "Missing TG_BOT_TOKEN secret (Telegram Bot Token)"
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            _error "Missing GH_TOKEN secret (GitHub PAT)"
          fi

          # KernelSU Validation
          if [[ "$KSU" != "no" && "$KSU" != "kernelsu" && "$KSU" != "next" ]]; then
            _error "Invalid KSU value: '$KSU'. Valid options: no | kernelsu | next"
          fi
          # Cannot use SuSFS or Manual Hook without KernelSU
          if [[ $KSU == "no" && $KSU_SUSFS == "true" ]]; then
              _error "Cannot enable KSU_SUSFS=true when KSU=no"
          fi
          if [[ $KSU == "no" && $KSU_MANUAL_HOOK == "true" ]]; then
            _error "Cannot use KSU_MANUAL_HOOK=true when KSU=no"
          fi
          # tiann is kprobes-only, no SuSFS support — warn and continue
          if [[ $KSU == "kernelsu" && $KSU_MANUAL_HOOK == "true" ]]; then
              echo "⚠️  KSU_MANUAL_HOOK=true ignored for KSU=kernelsu (kprobes-only)"
          fi
          if [[ $KSU == "kernelsu" && $KSU_SUSFS == "true" ]]; then
              echo "⚠️  KSU_SUSFS=true ignored for KSU=kernelsu — tiann does not support SuSFS. Use KSU=next."
          fi

          # LTO Validation
          if [[ "$LTO" != "thin" && "$LTO" != "full" ]]; then
            _error "Invalid LTO value: '$LTO'. Valid options: thin | full"
          fi
          if [[ "$LTO" == "full" ]]; then
            echo "⚠️  Full LTO selected — serial link, ~14–18 GB RAM, ~15–30 min. Runner needs 14 GB swap."
          fi

          if [[ $ret -gt 0 ]]; then
            exit $ret
          fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gh bc bison flex libssl-dev libelf-dev dwarves cpio patchutils
          pip install lxml

      - name: Maximise disk and create swap
        env:
          LTO: ${{ inputs.LTO }}
        run: |
          # Free up disk space (recovers ~20 GB regardless of LTO mode)
          sudo rm -rf /usr/local/lib/android \
                      /usr/local/share/boost \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/lib/jvm \
                      /usr/local/.ghcup \
                      /usr/local/share/powershell \
                      /usr/share/doc \
                      /usr/share/man || true

          # Swap size depends on LTO mode:
          #   full → 14 GB  (serial whole-program link needs ~14–18 GB RAM;
          #                  16 GB RAM + 14 GB swap = 30 GB virtual = safe)
          #   thin → 6 GB   (parallel link peaks at ~3–4 GB; 6 GB is generous headroom)
          sudo swapoff -a || true
          if [[ "$LTO" == "full" ]]; then
            SWAP_MB=14336
            echo "Full LTO selected — allocating 14 GB swap for whole-program link step."
          else
            SWAP_MB=6144
            echo "Thin LTO selected — allocating 6 GB swap (parallel link, low RAM usage)."
          fi

          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=$SWAP_MB status=progress
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          # swappiness=80 for full LTO so kernel uses swap before OOM-killing the linker;
          # default (60) is fine for thin LTO.
          if [[ "$LTO" == "full" ]]; then
            sudo sysctl -w vm.swappiness=80
          fi

          echo "Swap enabled:"
          free -h

      - name: Run Build Script
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }} # telegram chat id
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }} # telegram bot token
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # github token
          KSU: ${{ inputs.KSU }}
          KSU_SUSFS: ${{ inputs.KSU_SUSFS }}
          KSU_MANUAL_HOOK: ${{ inputs.KSU_MANUAL_HOOK }}
          LAST_BUILD: ${{ inputs.LAST_BUILD }}
          TODO: ${{ inputs.TODO }}
          KVER: ${{ inputs.KERNEL_VERSION }}
          LTO: ${{ inputs.LTO }}
        run: |
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py
          ./build.sh

      - name: Upload Artifacts (ZIP & IMG)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASE_NAME }}-${{ github.run_number }}
          path: |
            artifacts/*.zip
            artifacts/*.img

      - name: Upload Artifacts (Info File)
        uses: actions/upload-artifact@v4
        with:
          name: info-${{ github.run_number }}
          path: artifacts/*.txt
