name: Build GKI (Stock)

on:
  workflow_dispatch:
    inputs:
      LTO:
        description: |
          Link-Time Optimisation mode:

            thin → Thin LTO  [RECOMMENDED for CI/testing]
                   • Parallel link — uses all CPU cores
                   • RAM: ~3–4 GB  |  Link time: ~2–5 min
                   • 95% of Full LTO quality in 10% of the time
                   • Used by Google in official GKI builds
                   • CFI fully supported ✅

            full → Full LTO  [For final/release builds only]
                   • Serial whole-program link — single-threaded
                   • RAM: ~14–18 GB  |  Link time: ~15–30 min
                   • Slightly better dead-code elimination (~2–4%)
                   • Marginally smaller binary, negligible real-world perf delta
                   • Requires 14 GB swap — runner may be slower ⚠️
        default: "thin"
        type: choice
        options:
          - "thin"
          - "full"

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Inputs and Secrets
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LTO: ${{ inputs.LTO }}
        run: |
          _error() {
              echo "❌ ERROR: $*"
              let ret++
          }
          ret=0
          if [[ -z "$TG_CHAT_ID" ]]; then _error "Missing TG_CHAT_ID"; fi
          if [[ -z "$TG_BOT_TOKEN" ]]; then _error "Missing TG_BOT_TOKEN"; fi
          if [[ -z "$GH_TOKEN" ]]; then _error "Missing GH_TOKEN"; fi
          if [[ "$LTO" != "thin" && "$LTO" != "full" ]]; then _error "Invalid LTO value"; fi
          if [[ $ret -gt 0 ]]; then exit $ret; fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gh bc bison flex libssl-dev libelf-dev dwarves cpio patchutils
          pip install lxml

      - name: Maximise disk and create swap
        env:
          LTO: ${{ inputs.LTO }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/share/boost /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/share/swift /usr/lib/jvm /usr/local/.ghcup /usr/local/share/powershell /usr/share/doc /usr/share/man || true
          sudo swapoff -a || true
          if [[ "$LTO" == "full" ]]; then SWAP_MB=14336; else SWAP_MB=6144; fi
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=$SWAP_MB status=progress
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          if [[ "$LTO" == "full" ]]; then sudo sysctl -w vm.swappiness=80; fi

      - name: Run Build Script
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KSU: "no"
          KSU_SUSFS: "false"
          KSU_MANUAL_HOOK: "false"
          LAST_BUILD: "true"
          TODO: "kernel"
          KVER: "6.1"
          LTO: ${{ inputs.LTO }}
        run: |
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py
          ./build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stock-kernel-${{ github.run_number }}
          path: |
            artifacts/*.zip
            artifacts/*.img
            artifacts/*.txt

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stock-${{ github.run_number }}
          name: Stock Build ${{ github.run_number }}
          body_path: artifacts/release_notes.txt
          files: |
            artifacts/*.zip
            artifacts/*.img
            artifacts/*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
